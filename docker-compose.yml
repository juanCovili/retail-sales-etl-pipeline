version: '3.8'

services:
  pipeline:
    build: .
    container_name: retail_demand_pipeline
    volumes:
      - ./data/processed:/app/data/processed
    environment:
      - PYTHONPATH=/app
    command: python3 main.py

  dashboard:
    build: .
    container_name: retail_demand_dashboard
    ports:
      - "8080:8080"
    command: python3 -m http.server 8080 --directory static
    depends_on:
      - pipeline
